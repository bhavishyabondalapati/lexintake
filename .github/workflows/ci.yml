name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest + lockfile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: requirements.txt matches uv.lock
        working-directory: .
        run: |
          make requirements
          git diff --exit-code requirements.txt \
            || (echo "::error::requirements.txt is stale. Run 'make requirements' and commit it." && exit 1)

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        # --wait blocks until every service with a healthcheck reports healthy.
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Check API and frontend respond
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --output /dev/null http://localhost:3000

      - name: Worker logs
        if: always()
        run: docker compose logs worker

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
