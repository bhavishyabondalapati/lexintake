# Local dev stack. Values fall back to dev defaults so `docker compose up` works without a .env.
#
# Two backend images, from targets in backend/Dockerfile:
#   lexintake-api     small: api, watcher, migrate
#   lexintake-worker  big:   Celery parse worker (Docling, CPU-only torch, models baked in)
x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-lexintake}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-lexintake}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  BLOB_DIR: /data/blobs

x-api-image: &api-image
  image: lexintake-api:dev
  build:
    context: ./backend
    target: api
  env_file:
    - path: .env
      required: false

x-after-migrate: &after-migrate
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexintake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-lexintake}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro # enables pgvector on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the Alembic migrations once, then exits. The services below wait for it.
  migrate:
    <<: *api-image
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      <<: *backend-env
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - blobs:/data/blobs
    depends_on: *after-migrate
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 6

  # Drop PDFs into ./inbox on your machine; they get ingested and moved to inbox/.processed/.
  watcher:
    <<: *api-image
    command: ["python", "-m", "app.watcher"]
    environment:
      <<: *backend-env
      INBOX_DIR: /inbox
      WATCH_FORCE_POLLING: "true" # file events don't reliably cross Docker Desktop bind mounts
    volumes:
      - blobs:/data/blobs
      - ./inbox:/inbox
    depends_on: *after-migrate

  worker:
    image: lexintake-worker:dev
    build:
      context: ./backend
      target: worker
    command:
      - celery
      - -A
      - app.worker
      - worker
      - -Q
      - parse,celery
      - --loglevel=info
      - --concurrency=${WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=50 # restart a process now and then, so memory can't creep up
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    volumes:
      - blobs:/data/blobs
    depends_on: *after-migrate
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 20s
      retries: 8
      start_period: 30s

  # Slow tests with real Docling, in the same image the worker uses. Not started by `up`:
  #   make test-slow   (= docker compose --profile test run --rm --build worker-test)
  worker-test:
    image: lexintake-worker-test:dev
    build:
      context: ./backend
      target: worker-test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-lexintake}:${POSTGRES_PASSWORD:-change-me}@db:5432/lexintake_test
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: lexintake-frontend:dev
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000} # browser -> API
    environment:
      API_URL_INTERNAL: http://api:8000 # Next.js server -> API, over the Docker network
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    # Without this, `up --wait` counts the frontend as ready the moment the process starts,
    # before Next.js is listening.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  blobs: # original files, stored by SHA-256
