[project]
name = "lexintake-backend"
version = "0.1.0"
description = "LexIntake API and background workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# Dev-only: tests, linting, and the data scripts in ../scripts (faker, reportlab, pypdfium2,
# pillow, numpy). The Docker image installs with --no-dev, so none of these ship in it.
dev = [
    "faker>=40.44.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

# Not a library: uv installs the dependencies only, the code runs from ./app.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." puts the repo root on the path so tests can import scripts/.
pythonpath = [".", ".."]
