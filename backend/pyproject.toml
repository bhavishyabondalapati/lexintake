[project]
name = "lexintake-backend"
version = "0.1.0"
description = "LexIntake API and background workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6.3",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# Not a library: uv installs the dependencies only, the code runs from ./app.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
